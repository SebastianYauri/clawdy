name: Build and test

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows (.exe)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Version
        run: |
          $v = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { "0.0.$env:GITHUB_RUN_NUMBER" }
          "VERSION=$v" >> $env:GITHUB_ENV
          "VERSION = `"$v`"" | Set-Content -NoNewline clawdy_version.py

      - name: Package with PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller==6.16.0 pystray==0.19.5 pillow
          pyinstaller --noconfirm --clean --windowed --name Clawdy `
            --icon assets\icon.ico --add-data "assets;assets" `
            --hidden-import clawdy_gui --hidden-import clawdy_hook --hidden-import clawdy_system `
            --hidden-import clawdy_update --hidden-import clawdy_version --hidden-import clawdy_i18n `
            --hidden-import clawdy_tray --hidden-import pystray._win32 `
            clawdy.py
          Get-ChildItem dist\Clawdy | Select-Object Name, Length

      - name: Prepare a test profile
        run: |
          $p = Join-Path $env:RUNNER_TEMP 'profile'
          New-Item -ItemType Directory -Force "$p\.claude", "$p\AppData\Roaming", "$p\AppData\Local" | Out-Null
          # Someone else's hook that we must not touch
          '{"model":"opus","hooks":{"PreToolUse":[{"matcher":"Bash","hooks":[{"type":"command","command":"node other-hook.js"}]}]}}' |
            Set-Content -NoNewline "$p\.claude\settings.json"
          "PROFILE=$p" >> $env:GITHUB_ENV

      - name: "Test: welcome on first run"
        run: |
          $env:USERPROFILE = $env:PROFILE; $env:APPDATA = "$env:PROFILE\AppData\Roaming"; $env:LOCALAPPDATA = "$env:PROFILE\AppData\Local"
          $exe = Resolve-Path dist\Clawdy\Clawdy.exe
          $proc = Start-Process $exe -PassThru
          Start-Sleep 8
          if ($proc.HasExited) { throw "the program exited by itself (code $($proc.ExitCode))" }
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$env:RUNNER_TEMP\win-welcome.png")
          Start-Process $exe -ArgumentList '--quit' -Wait
          Start-Sleep 2
          if (-not $proc.HasExited) { throw "--quit did not close it" }
          "welcome OK and it quit on request"

      - name: "Test: connect to Claude Code and disconnect"
        run: |
          $env:USERPROFILE = $env:PROFILE; $env:APPDATA = "$env:PROFILE\AppData\Roaming"; $env:LOCALAPPDATA = "$env:PROFILE\AppData\Local"
          $exe = Resolve-Path dist\Clawdy\Clawdy.exe
          $r = Start-Process $exe -ArgumentList '--setup' -Wait -PassThru
          if ($r.ExitCode -ne 0) { throw "--setup failed ($($r.ExitCode))" }

          $s = Get-Content "$env:PROFILE\.claude\settings.json" -Raw | ConvertFrom-Json
          $n = @($s.hooks.PSObject.Properties).Count
          if ($n -ne 14) { throw "expected 14 events, found $n" }
          $other = @($s.hooks.PreToolUse | ForEach-Object { $_.hooks } | Where-Object { $_.command -like '*other-hook.js*' })
          if ($other.Count -ne 1) { throw "the other hook was lost" }
          $run = (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -ErrorAction SilentlyContinue).'Clawdy'
          if (-not $run) { throw "start at login was not set" }
          "start at login: $run"

          # The hook, run exactly like Claude Code runs it
          node packaging\ci\hook_test.js "$env:PROFILE\.claude\settings.json" "$env:LOCALAPPDATA\clawdy\sessions"
          if ($LASTEXITCODE -ne 0) { throw "the hook did not work" }

          $r = Start-Process $exe -ArgumentList '--uninstall' -Wait -PassThru
          $s = Get-Content "$env:PROFILE\.claude\settings.json" -Raw | ConvertFrom-Json
          $n = @($s.hooks.PSObject.Properties).Count
          if ($n -ne 1) { throw "after uninstall expected 1 event (the other one), found $n" }
          $run = (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -ErrorAction SilentlyContinue).'Clawdy'
          if ($run) { throw "start at login was left behind" }
          "connect and disconnect OK; the other hook is intact"

      - name: "Test: animations (demo mode)"
        run: |
          $env:USERPROFILE = $env:PROFILE; $env:APPDATA = "$env:PROFILE\AppData\Roaming"; $env:LOCALAPPDATA = "$env:PROFILE\AppData\Local"
          $exe = Resolve-Path dist\Clawdy\Clawdy.exe
          $proc = Start-Process $exe -ArgumentList '--demo' -PassThru
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          foreach ($i in 1..3) {
            Start-Sleep 4
            if ($proc.HasExited) { throw "demo mode exited by itself" }
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("$env:RUNNER_TEMP\win-demo-$i.png")
          }
          Stop-Process $proc

      - name: Build the installer
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress | Out-Null
          }
          & $iscc /Qp "/DAppVersion=$env:VERSION" packaging\windows\Clawdy.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          Get-Item dist\Clawdy-Setup.exe | Select-Object Name, Length

      - name: "Test: install and uninstall"
        run: |
          $r = Start-Process dist\Clawdy-Setup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($r.ExitCode -ne 0) { throw "install failed ($($r.ExitCode))" }
          $dir = "$env:LOCALAPPDATA\Programs\Clawdy"
          if (-not (Test-Path "$dir\Clawdy.exe")) { throw "not installed" }
          $menu = Get-ChildItem "$env:APPDATA\Microsoft\Windows\Start Menu\Programs" -Filter 'Clawdy.lnk' -Recurse
          if (-not $menu) { throw "no Start menu shortcut" }
          "installed in $dir with a Start menu shortcut"

          # Auto-update: fake a version 99 whose installer is this same one
          $cfg = "$env:APPDATA\clawdy"; New-Item -ItemType Directory -Force $cfg | Out-Null
          '{"setup_done": true}' | Set-Content -NoNewline "$cfg\config.json"
          $url = "file:///" + ((Resolve-Path dist\Clawdy-Setup.exe).Path -replace '\\', '/')
          $env:CLAWDY_FAKE_LATEST = '{"tag_name": "v99.0.0", "assets": [{"name": "Clawdy-Setup.exe", "browser_download_url": "' + $url + '"}]}'
          $log = "$env:LOCALAPPDATA\clawdy\update.log"
          $p1 = Start-Process "$dir\Clawdy.exe" -PassThru
          foreach ($i in 1..60) {
            Start-Sleep 1
            if ($p1.HasExited -and (Get-Process Clawdy -ErrorAction SilentlyContinue)) { break }
          }
          if (-not $p1.HasExited) { throw "the old version did not exit to update" }
          Start-Sleep 20        # let the new one open, check and NOT update again
          Get-Content $log -ErrorAction SilentlyContinue
          $running = @(Get-Process Clawdy -ErrorAction SilentlyContinue)
          if ($running.Count -ne 1) { throw "expected 1 running copy after updating, found $($running.Count)" }
          $times = @(Select-String -Path $log -Pattern "updating from").Count
          if ($times -ne 1) { throw "tried to update $times times (loop)" }
          "auto-update OK: exited, installed and reopened exactly once"
          Start-Process "$dir\Clawdy.exe" -ArgumentList '--quit' -Wait
          Remove-Item Env:CLAWDY_FAKE_LATEST

          $r = Start-Process "$dir\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES' -Wait -PassThru
          Start-Sleep 3
          if (Test-Path "$dir\Clawdy.exe") { throw "not uninstalled" }
          "uninstalled cleanly"

      - uses: actions/upload-artifact@v5
        with:
          name: windows
          path: dist/Clawdy-Setup.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: screenshots-windows
          path: ${{ runner.temp }}/win-*.png

  linux:
    name: Linux (.deb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.$GITHUB_RUN_NUMBER"; fi
          echo "VERSION=$v" >> "$GITHUB_ENV"

      - name: Build the .deb
        run: |
          echo "VERSION = \"$VERSION\"" > clawdy_version.py
          packaging/linux/build_deb.sh "$VERSION" dist

      - name: "Test: install"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ./dist/clawdy_*_all.deb xvfb
          command -v clawdy
          test -f /usr/share/applications/clawdy.desktop

      - name: "Test: connect, hook, animations and disconnect"
        run: |
          export HOME="$RUNNER_TEMP/profile"; mkdir -p "$HOME/.claude"
          unset XDG_CONFIG_HOME XDG_CACHE_HOME     # the runner sets them; we want the defaults
          echo '{"hooks":{"PreToolUse":[{"matcher":"Bash","hooks":[{"type":"command","command":"node other-hook.js"}]}]}}' > "$HOME/.claude/settings.json"
          clawdy --setup
          node packaging/ci/hook_test.js "$HOME/.claude/settings.json" "$HOME/.cache/clawdy/sessions"
          grep -q 'Exec=clawdy' "$HOME/.config/autostart/clawdy.desktop"
          xvfb-run -a clawdy --demo --selftest 5
          clawdy --uninstall
          python3 - <<'EOF'
          import json, os
          d = json.load(open(os.path.expanduser("~/.claude/settings.json")))
          assert list(d["hooks"]) == ["PreToolUse"], d
          assert d["hooks"]["PreToolUse"][0]["hooks"][0]["command"] == "node other-hook.js", d
          print("disconnected; the other hook is intact")
          EOF

      - name: "Test: auto-update (installed from source)"
        run: |
          export HOME="$RUNNER_TEMP/profile-source"; unset XDG_CONFIG_HOME XDG_CACHE_HOME
          mkdir -p "$HOME/.config/clawdy" "$HOME/.claude"
          echo '{"setup_done": true}' > "$HOME/.config/clawdy/config.json"
          Xvfb :99 -screen 0 800x600x24 & export DISPLAY=:99; sleep 2
          # fake version 99; files are downloaded from the commit under test
          export CLAWDY_FAKE_LATEST="{\"tag_name\": \"v99.0.0\", \"ref\": \"$GITHUB_SHA\"}"
          python3 install.py
          echo "# marker that must disappear" >> "$HOME/.clawdy/clawdy_gui.py"
          sleep 3; OLD=$(pgrep -f "\.clawdy/clawdy.py" | head -1); echo "old pid: $OLD"
          for i in $(seq 1 40); do
            sleep 1
            NEW=$(pgrep -f "\.clawdy/clawdy.py" | head -1)
            [ -n "$NEW" ] && [ "$NEW" != "$OLD" ] && break
          done
          cat "$HOME/.cache/clawdy/update.log"
          if grep -q "marker that must disappear" "$HOME/.clawdy/clawdy_gui.py"; then
            echo "files were not updated"; exit 1
          fi
          if [ -z "$NEW" ] || [ "$NEW" = "$OLD" ]; then
            echo "did not reopen after updating"; exit 1
          fi
          sleep 10
          if [ "$(pgrep -f '\.clawdy/clawdy.py' | head -1)" != "$NEW" ]; then
            echo "update loop"; exit 1
          fi
          echo "auto-update OK: new files and reopened exactly once"
          python3 "$HOME/.clawdy/clawdy.py" --quit

      - name: "Test: remove the package"
        run: |
          sudo apt-get remove -y -qq clawdy
          if command -v clawdy; then echo "not removed"; exit 1; fi

      - uses: actions/upload-artifact@v5
        with:
          name: linux
          path: dist/clawdy_*_all.deb
          if-no-files-found: error

  macos:
    name: macOS (.dmg)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.$GITHUB_RUN_NUMBER"; fi
          echo "VERSION=$v" >> "$GITHUB_ENV"
          echo "VERSION = \"$v\"" > clawdy_version.py

      - name: Package the app
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller==6.16.0 pillow pystray==0.19.5
          pyinstaller --noconfirm --clean --windowed --name "Clawdy" \
            --icon assets/icon.png --osx-bundle-identifier com.clawdy.app \
            --add-data "assets:assets" \
            --hidden-import clawdy_gui --hidden-import clawdy_hook --hidden-import clawdy_system \
            --hidden-import clawdy_update --hidden-import clawdy_version --hidden-import clawdy_i18n \
            --hidden-import clawdy_tray --hidden-import pystray._darwin \
            clawdy.py
          APP="dist/Clawdy.app"
          # a widget: no Dock icon
          plutil -insert LSUIElement -bool true "$APP/Contents/Info.plist"
          plutil -replace CFBundleShortVersionString -string "$VERSION" "$APP/Contents/Info.plist"
          codesign --force --deep -s - "$APP"
          ls -la "$APP/Contents/MacOS"

      - name: "Test: connect, hook and disconnect"
        run: |
          BIN="$PWD/dist/Clawdy.app/Contents/MacOS/Clawdy"
          export HOME="$RUNNER_TEMP/profile"; mkdir -p "$HOME/.claude"
          echo '{"hooks":{"PreToolUse":[{"matcher":"Bash","hooks":[{"type":"command","command":"node other-hook.js"}]}]}}' > "$HOME/.claude/settings.json"
          "$BIN" --setup
          node packaging/ci/hook_test.js "$HOME/.claude/settings.json" "$HOME/Library/Caches/clawdy/sessions"
          test -f "$HOME/Library/LaunchAgents/com.clawdy.app.plist"
          "$BIN" --uninstall
          python3 - <<'EOF'
          import json, os
          d = json.load(open(os.path.expanduser("~/.claude/settings.json")))
          assert list(d["hooks"]) == ["PreToolUse"], d
          assert not os.path.exists(os.path.expanduser("~/Library/LaunchAgents/com.clawdy.app.plist"))
          print("disconnected; the other hook is intact")
          EOF

      - name: "Test: animations (demo mode)"
        run: |
          export HOME="$RUNNER_TEMP/profile-demo"; mkdir -p "$HOME"
          "dist/Clawdy.app/Contents/MacOS/Clawdy" --demo &
          PID=$!
          sleep 8
          if ! kill -0 $PID; then echo "demo mode exited by itself"; exit 1; fi
          screencapture -x "$RUNNER_TEMP/mac-demo.png" || true
          kill $PID

      - name: Build the .dmg and .zip
        run: |
          mkdir -p staging
          cp -R "dist/Clawdy.app" staging/
          ln -s /Applications staging/Applications
          hdiutil create -volname "Clawdy" -srcfolder staging -ov -format UDZO dist/Clawdy-mac.dmg
          ditto -c -k --keepParent "dist/Clawdy.app" dist/Clawdy-mac.zip
          ls -la dist

      - name: "Test: auto-update"
        run: |
          export HOME="$RUNNER_TEMP/profile-update"; mkdir -p "$HOME/Library/Application Support/clawdy" "$HOME/Apps"
          echo '{"setup_done": true}' > "$HOME/Library/Application Support/clawdy/config.json"
          cp -R "dist/Clawdy.app" "$HOME/Apps/"
          export CLAWDY_FAKE_LATEST="{\"tag_name\": \"v99.0.0\", \"assets\": [{\"name\": \"Clawdy-mac.zip\", \"browser_download_url\": \"file://$PWD/dist/Clawdy-mac.zip\"}]}"
          CLAWDY_DEBUG=1 "$HOME/Apps/Clawdy.app/Contents/MacOS/Clawdy" > "$RUNNER_TEMP/mac-app.log" 2>&1 &
          OLD=$!
          for i in $(seq 1 60); do
            sleep 1
            if ! kill -0 $OLD 2>/dev/null; then break; fi
          done
          sleep 20
          LOG="$HOME/Library/Caches/clawdy/update.log"
          echo "--- update log ---"; cat "$LOG" || true
          echo "--- program output ---"; cat "$RUNNER_TEMP/mac-app.log" || true
          echo "--- debug log ---"; cat "$HOME/Library/Caches/clawdy/debug.log" || true
          echo "--- processes ---"; ps -axo pid,etime,command | grep -i "[c]lawd" || true
          if kill -0 $OLD 2>/dev/null; then echo "the old version did not exit"; exit 1; fi
          N=$(pgrep -f "Apps/Clawdy.app/Contents/MacOS" | wc -l | tr -d ' ')
          if [ "$N" != "1" ]; then echo "expected 1 running copy after updating, found $N"; exit 1; fi
          if [ "$(grep -c 'updating from' "$LOG" 2>/dev/null)" != "1" ]; then echo "did not update exactly once"; exit 1; fi
          echo "auto-update OK"
          pkill -f "Apps/Clawdy.app/Contents/MacOS" || true

      - uses: actions/upload-artifact@v5
        with:
          name: macos
          path: |
            dist/Clawdy-mac.dmg
            dist/Clawdy-mac.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: screenshots-mac
          path: ${{ runner.temp }}/mac-*.png

  release:
    name: Publish release
    if: github.ref_type == 'tag'
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: out
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/windows/Clawdy-Setup.exe out/linux/*.deb \
            out/macos/Clawdy-mac.dmg out/macos/Clawdy-mac.zip \
            --title "Clawdy ${GITHUB_REF_NAME#v}" \
            --notes-file packaging/release-notes.md
